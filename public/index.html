<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bodega Peligrosa</title>
<meta name="description" content="Bodega Peligrosa · Código de Contención — Eliminación de Residuos Peligrosos, Ingeniería Ambiental UTEQ">
<link rel="icon" href="logo-ingenieria-ambiental-uteq.png">
<style>
:root{
  --bg:#07100b; --bg2:#0c1912; --card:#102117; --line:#23402d; --txt:#e8f3ea; --ap:#9db5a3;
  --toxi:#9cff3b; --toxi2:#57d61a; --haz:#ffd21f; --ok:#38d97a; --mal:#ff5a5a; --par:#ffc23d; --azul:#5fb4ff;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(ellipse at 50% -20%, #18361f 0%, var(--bg) 60%) fixed; color:var(--txt);
  font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif; line-height:1.5; min-height:100vh}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:49;opacity:.05;background:repeating-linear-gradient(0deg,#fff 0 1px,transparent 1px 3px)}
h1,h2,h3{margin:0;letter-spacing:.04em}
.haz{height:7px;background:repeating-linear-gradient(-45deg,var(--haz) 0 12px,#111 12px 24px)}
header.top{position:sticky;top:0;z-index:40;background:rgba(7,16,11,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.topin{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:8px 16px;max-width:1240px;margin:0 auto}
.marca{display:flex;align-items:center;gap:10px}
.marca img{width:38px;height:38px;border-radius:50%;background:#fff}
.logo{font-weight:800;font-size:1.15rem;color:var(--toxi);text-shadow:0 0 12px rgba(156,255,59,.55);letter-spacing:.12em}
.sub{font-size:.72rem;color:var(--ap);letter-spacing:.04em}
.chip{display:inline-flex;gap:6px;align-items:center;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:.84rem;white-space:nowrap}
.chip.warn{border-color:var(--par);color:var(--par)} .chip.danger{border-color:var(--mal);color:var(--mal)}
.chip.reloj{font-variant-numeric:tabular-nums;font-weight:700}
.wrap{max-width:1240px;margin:0 auto;padding:14px 16px 40px}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:linear-gradient(180deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:0 8px 28px rgba(0,0,0,.45)}
.card + .card{margin-top:12px}
.zonas{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:thin}
.ztab{flex:0 0 auto;min-width:126px;text-align:left;padding:8px 11px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);color:var(--txt);font:inherit;cursor:pointer}
.ztab .n{font-size:.68rem;color:var(--ap);text-transform:uppercase;letter-spacing:.12em}
.ztab .t{font-weight:700;font-size:.9rem;display:block}
.ztab .e{font-size:.74rem;color:var(--ap)}
.ztab.act{border-color:var(--toxi);box-shadow:0 0 0 2px rgba(156,255,59,.25) inset}
.ztab.ok .e{color:var(--ok)} .ztab.lock{opacity:.55}
.ztab:focus-visible,.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.etq{color:var(--toxi);font-size:.74rem;letter-spacing:.2em;text-transform:uppercase}
.instr{border:1px dashed var(--haz);border-radius:10px;padding:10px 12px;background:rgba(255,210,31,.05);font-size:.88rem;margin:8px 0 0}
.nivel{font-size:.7rem;color:var(--ap);text-transform:uppercase;letter-spacing:.14em}
.enun{font-size:1.08rem;margin:.4rem 0 1rem}
.enun svg{vertical-align:middle;margin:0 4px}
.btn{appearance:none;border:1px solid var(--toxi2);background:linear-gradient(180deg,#3d8f14,#21560a);color:#fff;padding:10px 20px;border-radius:10px;font:inherit;font-weight:700;letter-spacing:.04em;cursor:pointer}
.btn:hover:not(:disabled){filter:brightness(1.2)} .btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sec{background:transparent;border-color:var(--line);color:var(--txt)}
.btn.sm{padding:5px 10px;font-size:.82rem}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;margin:7px 0;padding:11px 13px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.02);color:var(--txt);font:inherit;cursor:pointer}
.opt:hover{border-color:var(--toxi2)} .opt.sel{border-color:var(--toxi);background:rgba(156,255,59,.12)}
.opt .mark{flex:0 0 20px;height:20px;border:2px solid var(--ap);border-radius:50%;margin-top:2px}
.opt.multi .mark{border-radius:5px} .opt.sel .mark{background:var(--toxi);border-color:var(--toxi)}
.ord{display:flex;gap:8px;align-items:center;margin:7px 0;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.02)}
.ord .n,.mizq .n{flex:0 0 26px;height:26px;border-radius:50%;background:#2a5a17;display:grid;place-items:center;font-weight:700;font-size:.82rem}
.ord .t{flex:1}
.ord button{border:1px solid var(--line);background:transparent;color:var(--txt);border-radius:8px;width:36px;height:36px;cursor:pointer}
.ord button:disabled{opacity:.3}
.hint{color:var(--ap);font-size:.85rem}
.fb{border-radius:10px;padding:13px;margin:10px 0;border:1px solid}
.fb.ok{border-color:var(--ok);background:rgba(56,217,122,.08)} .fb.mal{border-color:var(--mal);background:rgba(255,90,90,.08)} .fb.par{border-color:var(--par);background:rgba(255,194,61,.08)}
.prog{height:8px;background:#1b3222;border-radius:6px;overflow:hidden;margin:8px 0 2px}
.prog > i{display:block;height:100%;background:linear-gradient(90deg,#2a7a10,var(--toxi));transition:width .4s}
.puzzle{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:#000;border:2px solid var(--line);border-radius:10px;overflow:hidden;aspect-ratio:1}
.tile{background-size:400% 400%}
.tile.lock{background:linear-gradient(135deg,#132619,#08100b)!important;display:grid;place-items:center;color:#2f5a3a;font-size:1.1rem}
.tile.new{animation:pop .9s}
@keyframes pop{0%{transform:scale(1.3);filter:brightness(3)}100%{transform:none;filter:none}}
table{width:100%;border-collapse:collapse;font-size:.9rem}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
tr.yo td{color:var(--toxi);font-weight:700}
.center{text-align:center} .big{font-size:2.2rem}
.login{max-width:470px;margin:6vh auto}
select,input,textarea{width:100%;padding:11px;margin:5px 0 10px;background:#08130c;color:var(--txt);border:1px solid var(--line);border-radius:10px;font:inherit;font-size:1rem}
textarea{min-height:120px;resize:vertical}
.reglas{border:1px dashed var(--haz);border-radius:10px;padding:11px 13px;background:rgba(255,210,31,.05);margin:12px 0;font-size:.9rem}
.rev{display:inline-block;margin:4px 6px 4px 0;padding:7px 12px;border:1px solid var(--toxi2);border-radius:8px;background:rgba(156,255,59,.08);color:var(--haz);font-size:1.1rem;letter-spacing:.2em;font-weight:700}
.turno{margin-top:10px;padding:9px 12px;border:1px dashed var(--toxi2);border-radius:10px;background:rgba(156,255,59,.06);font-size:.9rem}
.miembro{display:inline-block;margin:2px 4px 2px 0;padding:2px 10px;border:1px solid var(--line);border-radius:999px;font-size:.8rem;color:var(--ap)}
.miembro.on{border-color:var(--haz);color:var(--haz);font-weight:700}
.match{display:grid;gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(180px,42%);gap:10px;align-items:center}
@media (max-width:640px){.mrow{grid-template-columns:minmax(0,1fr)}}
.mizq{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.02)}
.mizq svg{flex:0 0 auto}
.chipb{display:inline-block;margin:3px 6px 3px 0;padding:3px 11px;border:1px solid var(--haz);color:var(--haz);border-radius:999px;font-size:.88rem}
.parrafo{line-height:2.5;font-size:1.03rem}
select.hueco{display:inline-block;width:auto;min-width:96px;max-width:100%;margin:0 4px;padding:4px 8px;font-size:.95rem;vertical-align:middle}
/* bodega */
.tambores{display:grid;gap:8px}
.tamb{display:grid;grid-template-columns:44px minmax(0,1fr) 150px;gap:10px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.tamb.sel{border-color:var(--toxi)}
@media (max-width:560px){.tamb{grid-template-columns:44px minmax(0,1fr)}.tamb select{grid-column:1/-1}}
.tamb select{margin:0}
.jaulas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.jaula{min-height:110px;border:2px dashed #3d6a49;border-radius:12px;padding:8px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.03) 0 2px,transparent 2px 16px);cursor:pointer}
.jaula h4{margin:0 0 6px;font-size:.8rem;color:var(--ap);letter-spacing:.1em;text-transform:uppercase}
.jaula.alerta{border-color:var(--mal)}
.drum{display:inline-flex;align-items:center;gap:4px;margin:2px;padding:2px 6px;border-radius:8px;background:#1d3a26;font-size:.76rem}
/* herramientas */
.tools{display:flex;gap:8px;flex-wrap:wrap}
.modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.72);display:none;align-items:flex-start;justify-content:center;padding:4vh 12px}
.modal.on{display:flex}
.modal .card{width:min(980px,100%);max-height:90vh;overflow:auto}
.lst{font-size:.86rem}
.lst td:first-child{white-space:nowrap;font-weight:700;color:var(--haz)}
.mk{border-collapse:collapse;font-size:.78rem;margin:8px auto}
.mk td,.mk th{border:1px solid #333;width:38px;height:28px;text-align:center;padding:0}
.mk .V{background:#33c24a;color:#000}.mk .A{background:#ffe44d;color:#000}.mk .R{background:#e32b2b;color:#fff}
.mk td.hi{outline:3px solid #fff;outline-offset:-3px}
/* etiqueta SGA */
.paleta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pz{border:2px solid transparent;border-radius:8px;background:#fff;padding:2px;cursor:grab}
.pz.on{border-color:var(--toxi);box-shadow:0 0 0 3px rgba(156,255,59,.35)}
.etiqueta{min-height:120px;border:3px solid #111;border-radius:6px;background:#fff;color:#111;padding:10px;margin:8px 0}
.etiqueta.over{outline:3px dashed var(--toxi)}
.etiqueta .ph{color:#777;font-size:.85rem}
.cwwrap{overflow-x:auto;padding:4px 0}
.cw,.sopa{display:grid;gap:2px;width:max-content}
.cwc{position:relative;width:var(--cs);height:var(--cs)} .cwb{width:var(--cs);height:var(--cs)}
.cwc input{width:100%;height:100%;margin:0;padding:0;text-align:center;font-weight:700;font-size:calc(var(--cs)*.55);text-transform:uppercase;background:#f1f6e8;color:#0d1a10;border:1px solid #3b5a1d;border-radius:3px}
.cwc.act input{background:#e6ff9c}
.cwc .num{position:absolute;top:0;left:2px;font-size:calc(var(--cs)*.3);color:#2a6010;font-weight:700;z-index:2;pointer-events:none}
.sc{width:var(--cs);height:var(--cs);padding:0;border:1px solid var(--line);background:#0c1a10;color:var(--txt);font:inherit;font-weight:700;font-size:calc(var(--cs)*.5);border-radius:3px;cursor:pointer}
.sc.ini{outline:3px solid var(--haz)}
.clues{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
@media (max-width:760px){.clues{grid-template-columns:1fr}}
.clues h4{margin:0 0 4px;color:var(--toxi);letter-spacing:.1em;text-transform:uppercase;font-size:.8rem}
.clues ul{list-style:none;margin:0;padding:0}
.cl{appearance:none;display:block;width:100%;text-align:left;padding:6px 8px;margin:3px 0;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--txt);font:inherit;font-size:.88rem;cursor:pointer}
.resp{display:inline-block;margin-left:4px;padding:0 8px;border-radius:999px;background:rgba(255,210,31,.12);color:var(--haz);font-size:.72rem}
.sopapistas{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.sopapistas div{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:10px;padding:4px 8px;font-size:.82rem}
.marca2{appearance:none;margin:4px 6px 0 0;padding:3px 10px;border:2px solid;border-radius:8px;background:transparent;color:var(--txt);font:inherit;font-size:.82rem;cursor:pointer}
.overlay{position:fixed;inset:0;z-index:100;display:none;place-items:center;background:rgba(40,30,0,.94);text-align:center;padding:24px}
.overlay.on{display:grid}
.ganador{border-color:var(--haz)!important;box-shadow:0 0 40px rgba(255,210,31,.3)!important}
.tag{font-size:.7rem;padding:2px 8px;border-radius:6px;background:#2a5a17;text-transform:uppercase;letter-spacing:.1em}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:12px}
.estado-guardado{font-size:.8rem;color:var(--ap)}
.notas td{padding:4px}
.confeti{position:fixed;inset:0;pointer-events:none;z-index:120;overflow:hidden}
.confeti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:caer linear forwards}
@keyframes caer{to{top:105vh;transform:rotate(720deg)}}
.festejo{animation:latido .6s}
@keyframes latido{0%{transform:scale(.96)}50%{transform:scale(1.03)}100%{transform:none}}
.sacudir{animation:sacudir .45s}
@keyframes sacudir{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
img.picto,img.rotulo{vertical-align:middle;display:inline-block}
.mizq img{flex:0 0 auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="overlay" id="ovSalida" role="alertdialog" aria-modal="true" aria-labelledby="ovTitulo">
  <div><div class="big">&#9763;</div><h2 id="ovTitulo">Saliste de la pantalla</h2>
  <p id="ovTexto" style="max-width:520px;margin:12px auto"></p><button class="btn" id="ovBtn">Volver a la bodega</button></div>
</div>
<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalT"><div class="card" id="modalC"></div></div>

<header class="top"><div class="haz"></div>
  <div class="topin">
    <div class="marca"><img src="logo-ingenieria-ambiental-uteq.png" alt="Logotipo de Ingeniería Ambiental UTEQ">
      <div><div class="logo">&#9888; BODEGA PELIGROSA</div><div class="sub">Eliminación de Residuos Peligrosos · Ingeniería Ambiental UTEQ</div></div></div>
    <div id="barra" style="display:flex;gap:8px;flex-wrap:wrap"></div>
  </div>
</header>
<main class="wrap" id="app"></main>

<script src="graficos.js"></script>
<script src="listado142.js"></script>
<script>
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rico = (t,sz)=>GRAF.rico(t,esc,sz);
const f2 = n=>Number(n).toFixed(2).replace('.',',');
let token=null; try{token=sessionStorage.getItem('bt_token');}catch(e){}
let E=null, vista='z1', modo='login', fichasPrevias=null, enviando=false;
let sel=[], ordenActual=[], bodegaSel=[], extraActual=null;

async function api(ruta,metodo='GET',cuerpo){
  const r = await fetch(ruta,{method:metodo,headers:Object.assign({'Content-Type':'application/json'},token?{'Authorization':'Bearer '+token}:{}),body:cuerpo?JSON.stringify(cuerpo):undefined});
  if(r.status===401){ cerrarSesion(); throw new Error('sesion'); }
  return r.json();
}
function cerrarSesion(){ try{sessionStorage.removeItem('bt_token');}catch(e){} token=null; modo='login'; mostrarLogin(); }

/* ---------- imagen del rompecabezas ---------- */
const IMG='data:image/svg+xml;utf8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
<defs><linearGradient id="c" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1c4a26"/><stop offset="1" stop-color="#071009"/></linearGradient></defs>
<rect width="400" height="400" fill="url(#c)"/><path d="M40 170 200 80 360 170v170H40z" fill="#d9e4d2" stroke="#123" stroke-width="6"/>
<path d="M40 170 200 80 360 170" fill="none" stroke="#2f6b12" stroke-width="14"/><rect x="70" y="300" width="260" height="14" fill="#7a5a2d"/>
<g fill="#2f7fb8" stroke="#123" stroke-width="3"><rect x="90" y="232" width="44" height="68" rx="6"/><rect x="146" y="232" width="44" height="68" rx="6"/><rect x="210" y="232" width="44" height="68" rx="6"/><rect x="266" y="232" width="44" height="68" rx="6"/></g>
<g transform="translate(186 150) rotate(45)"><rect x="-26" y="-26" width="52" height="52" fill="#fff" stroke="#d40c1c" stroke-width="7"/></g>
<path d="M172 152l10 12 22-24" fill="none" stroke="#1d9b3d" stroke-width="9" stroke-linecap="round"/>
<rect y="340" width="400" height="60" fill="#111"/><text x="200" y="378" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#9cff3b" letter-spacing="4">BODEGA SEGURA</text></svg>`);
function pintarPuzzle(prev){
  const c=$('#puzzle'); if(!c) return; let h='';
  E.piezas.forEach((f,r)=>f.forEach((ok,k)=>{ const nueva=ok&&prev&&!prev[r][k]; const pos=`${k*100/3}% ${r*100/3}%`;
    h+= ok?`<div class="tile ${nueva?'new':''}" style="background-image:url('${IMG}');background-position:${pos}"></div>`:`<div class="tile lock" title="Zona ${r+1}, sello ${k+1}">&#128274;</div>`; }));
  c.innerHTML=h;
}

/* ---------- reloj y barra ---------- */
let finLocal=null;
function fijarReloj(){ const t=E.tiempo; finLocal = t.iniciado ? Date.now()+t.restante*1000 : null; }
function txtReloj(){
  if(!E) return '';
  if(!E.tiempo.iniciado) return `${Math.round(E.tiempo.restante/60)} min`;
  const s = E.tiempo.pausado||!E.abierto ? E.tiempo.restante : Math.max(0,Math.round((finLocal-Date.now())/1000));
  return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`+(E.tiempo.pausado?' (pausa)':'');
}
setInterval(()=>{ const r=$('#reloj'); if(r&&E){ r.textContent='⏱ '+txtReloj(); const s=(finLocal-Date.now())/1000; r.parentNode&&r.classList.toggle('danger', E.tiempo.iniciado && s<300); if(E.tiempo.iniciado&&!E.tiempo.pausado&&E.abierto&&s<=0&&!E.tiempo.agotado){ refrescar(true); } } },1000);
function pintarBarra(){
  if(!E){ $('#barra').innerHTML=''; return; }
  const n=E.salidas, dg=E.salidas_gratis; let cls='chip', txt;
  if(n<dg){ txt=`Salidas: ${n}/${dg} sin descuento`; if(n>0) cls+=' warn'; } else { cls+=' danger'; txt=`Salidas: ${n} · −${f2(E.penalizacion_actual)}`; }
  $('#barra').innerHTML=`<span class="chip">&#128101; ${esc(E.grupo.nombre)}</span><span class="chip">&#128737; ${E.total_sellos}/${E.max_sellos} sellos</span>
   <span class="chip reloj" id="reloj" aria-live="off">⏱ ${txtReloj()}</span>
   <button class="chip" id="btnSonido" onclick="alternarSonido()" aria-pressed="${SONIDO}" title="Activar o silenciar los sonidos" style="cursor:pointer;color:inherit;font:inherit">${SONIDO?'🔊 Sonido':'🔇 Silencio'}</button>
   <span class="${cls}" title="Las 2 primeras salidas no descuentan; desde la 3.ª cada una resta ${f2(E.descuento)} puntos.">&#9888; ${txt}</span>`;
}

/* ---------- ingreso ---------- */
async function mostrarLogin(){
  modo='login'; E=null; pintarBarra();
  let grupos=[]; try{ grupos=await (await fetch('/api/grupos-publicos')).json(); }catch(e){}
  $('#app').innerHTML=`<div class="login card">
    <h1 class="center" style="color:var(--toxi)">Bodega Peligrosa</h1>
    <p class="center hint">Código de Contención · Semana 4 · AM 142, NTE INEN 2266 y SGA</p>
    <p style="font-size:.95rem">Una empresa que genera residuos peligrosos tiene su <b>bodega de almacenamiento temporal</b> en emergencia: llegaron envases sin identificar con residuos inflamables, corrosivos, comburentes, tóxicos y gases a presión. Su grupo es la <b>brigada de gestión ambiental</b>: identifiquen cada residuo, rotúlenlo, etiquétenlo y ubíquenlo de forma segura antes de que la bodega quede fuera de control.</p>
    <div class="reglas"><b>&#9888; Antes de entrar</b><br>
      • Para entrar, elijan su grupo y <b>resuelvan el acertijo de la puerta</b>: una característica de peligrosidad del CRTIB.<br>
      • Un solo dispositivo por grupo y sin salir de esta pantalla. <b>Las 2 primeras salidas no descuentan; desde la 3.ª, cada una resta 0,50</b> sobre 10. Las herramientas (Archivo 142 y Matriz) se abren dentro del juego y no cuentan como salida.<br>
      • 4 zonas automáticas (7 pts), un expediente que revisa el docente (2 pts) y un reto final con crucigrama y sopa de letras (1 pt).<br>

async function enviar(){

  const antes=E.temas.map(t=>({id:t.id,sellos:t.sellos,cerrado:t.cerrado}));

  if(E.temas.every(x=>x.cerrado) && !E.expediente.entregado) msg+=`<div class="fb par">Terminaron las 4 zonas. Falta el <b>Expediente de contención</b> (Zona 5); después se abre el reto final.</div>`;

    <button class="btn" id="btnSig">Continuar</button>`;
  const aside=document.querySelector('aside'); if(aside){ const prev=fichasPrevias; aside.innerHTML=lateral(); pintarPuzzle(prev); fichasPrevias=E.piezas.map(f=>f.slice()); }
  if(resp.ok) confeti();
  $('#btnSig').onclick=()=>{ if(extraActual){ extraActual=null; vista='extras'; } render(); };
  $('#btnSig').focus();
}

function enlazarReto(){
  if(!RT || !$('#cw')) return;
  const cw=RT.cw, sp=RT.sp, inputs=[...document.querySelectorAll('#cw input')], porK={}; inputs.forEach(i=>porK[i.dataset.r+','+i.dataset.c]=i);

  const celdasS=[...document.querySelectorAll('#sopa .sc')], sc=(r,c)=>celdasS[r*sp.n+c];

    RT.sopa.forEach((s,i)=>linea(s).forEach(([r,c])=>{ const b=sc(r,c); b.style.background=`hsl(${(i*53+90)%360} 65% 34%)`; b.style.color='#fff'; }));
    if(RT.ini) sc(RT.ini[0],RT.ini[1]).classList.add('ini');
    $('#sopaMarcas').innerHTML=RT.sopa.length?`<div class="hint">Marcadas: <b>${RT.sopa.length}</b> de ${sp.palabras.length}. Toquen una marca para quitarla.</div>`+RT.sopa.map((s,i)=>`<button class="marca2" data-i="${i}" style="border-color:hsl(${(i*53+90)%360} 65% 50%)">${linea(s).map(([r,c])=>sp.grid[r][c]).join('')} ✕</button>`).join(''):'';
    document.querySelectorAll('.marca2').forEach(b=>b.onclick=()=>{ RT.sopa.splice(+b.dataset.i,1); guardarReto(); pintarSopa(); }); };
  celdasS.forEach(b=>b.onclick=()=>{ const r=+b.dataset.r, c=+b.dataset.c, msg=$('#sopaMsg'); msg.textContent='';
    if(!RT.ini){ RT.ini=[r,c]; pintarSopa(); return; } const [r1,c1]=RT.ini; if(r1===r&&c1===c){ RT.ini=null; pintarSopa(); return; }
    const dr=r-r1, dc=c-c1; if(!(dr===0||dc===0||Math.abs(dr)===Math.abs(dc))){ msg.textContent='Esa línea no es recta: horizontal, vertical o diagonal.'; RT.ini=null; pintarSopa(); return; }
    if(RT.sopa.length>=sp.palabras.length+4){ msg.textContent='Demasiadas marcas: quiten alguna.'; RT.ini=null; pintarSopa(); return; }
    RT.sopa.push([r1,c1,r,c]); RT.ini=null; guardarReto(); pintarSopa(); });
  pintarSopa();
  $('#btnEntregar').onclick=async()=>{ const btn=$('#btnEntregar'), m=$('#entregaMsg');
    if(!RT.armado){ RT.armado=true; btn.textContent='Pulsen otra vez para ENTREGAR'; m.textContent='Después de entregar no se puede cambiar nada.'; setTimeout(()=>{ if(RT&&RT.armado&&document.body.contains(btn)){ RT.armado=false; btn.textContent='Entregar reto final'; m.textContent='Revisen con calma: no se puede cambiar después.'; } },6000); return; }
    btn.disabled=true; clearTimeout(retoTimer);
    const r=await api('/api/reto','POST',{cw:respCW(),sopa:RT.sopa,letras:RT.letras,entregar:true});
    if(r.error){ m.textContent=r.error; btn.disabled=false; return; }
    E=r.estado; RT=null; vista = E.fase==='extras'?'extras':'reto'; render(); };
}

/* ---------- extras y final ---------- */

  const items=faltan.map(t=>`<div class="card"><div class="etq">Zona ${t.id}</div><b>${esc(t.zona)}</b><div class="hint">Faltan <b>${t.faltan}</b> sello(s). Cada reto extra acertado por completo da 1 sello. Disponibles: ${t.extras_quedan}.</div>
    <div style="margin-top:8px">${t.extras_quedan>0&&E.abierto&&!E.tiempo.agotado?`<button class="btn" data-extra="${t.id}">Enfrentar reto extra</button>`:'<span class="tag">Sin retos digitales</span> <span class="hint">Pidan un reto presencial al docente.</span>'}</div></div>`).join('');
  return `<div class="card"><div class="etq">Fase final</div><h2>La bodega aún no está sellada</h2><p>Entregaron todo, pero faltan sellos. El primer grupo con los ${E.max_sellos} sellos gana el punto directo. <b>Los retos extra no cambian la nota.</b></p></div>${items}`;
}
async function abrirExtra(tema){

  if(!r.pregunta){ alert('No hay más retos digitales en esta zona. Pidan un reto presencial al docente.'); return; }

function pantallaFinal(){

   <p>${g?'Su grupo fue el primero en reunir los 16 sellos: <b>+1 punto directo</b>.':(!E.reto_ok_ganar?`Reunieron los sellos, pero para ganar el punto hacía falta al menos el <b>${Math.round(E.min_reto_ganar*100)} %</b> del reto final.`:(E.ganador?`Reunieron todos los sellos; el grupo ganador fue <b>${esc(E.ganador)}</b>.`:'Reunieron todos los sellos.'))}</p>
   <p class="hint">Descarguen su informe PDF en el panel «Mi nota».</p></div>`;

/* ---------- sonidos y celebración ---------- */
let SONIDO=true; try{ SONIDO = localStorage.getItem('bt_sonido')!=='0'; }catch(e){}
function alternarSonido(){ SONIDO=!SONIDO; try{ localStorage.setItem('bt_sonido', SONIDO?'1':'0'); }catch(e){} pintarBarra(); if(SONIDO) sonar('ok'); }
const MSJ_OK=['¡Felicidades, muy bien!','¡Excelente, brigada!','¡Correcto! Residuo bajo control','¡Muy bien! Así se maneja una bodega segura'];
const MSJ_PAR=['¡Bien, pero falta completar!','Van por buen camino, pero no todo está bien','Casi: revisen lo que falló'];
const MSJ_MAL=['¡Uy, qué mal! Esta vez no','¡Alerta! Respuesta incorrecta','¡Fuga en la bodega! No era esa'];
const azar=a=>a[Math.floor(Math.random()*a.length)];
let _ac=null;
function sonar(tipo){
  if(!SONIDO) return;
  try{
    _ac=_ac||new (window.AudioContext||window.webkitAudioContext)();
    const notas = tipo==='ok'?[[523,0],[659,.11],[784,.22],[1047,.34]] : tipo==='par'?[[523,0],[587,.14]] : [[220,0],[165,.18]];
    notas.forEach(([fr,t0])=>{ const o=_ac.createOscillator(), g=_ac.createGain(); o.type=tipo==='mal'?'sawtooth':'triangle'; o.frequency.value=fr;
      const t=_ac.currentTime+t0; g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(tipo==='mal'?0.12:0.2,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+(tipo==='mal'?0.32:0.22));
      o.connect(g).connect(_ac.destination); o.start(t); o.stop(t+0.4); });
  }catch(e){}
}
function confeti(){
  if(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const box=document.createElement('div'); box.className='confeti'; box.setAttribute('aria-hidden','true');
  const col=['#9cff3b','#ffd21f','#38d97a','#5fb4ff','#ff7a59'];
  box.innerHTML=Array.from({length:60},(_,i)=>`<i style="left:${Math.random()*100}%;background:${col[i%5]};animation-delay:${Math.random()*.4}s;animation-duration:${1.4+Math.random()}s;transform:rotate(${Math.random()*360}deg)"></i>`).join('');
  document.body.appendChild(box); setTimeout(()=>box.remove(),2800);
}

/* ---------- minijuegos dentro de las zonas ---------- */
let MINI=null;
function miniSopaHTML(p){
  MINI={tipo:'sopa',sopa:[],ini:null,p};
  const cs=`min(34px, calc((100vw - 90px) / ${p.n}))`;
  let g=''; for(let r=0;r<p.n;r++) for(let c=0;c<p.n;c++) g+=`<button class="sc" data-r="${r}" data-c="${c}" aria-label="Fila ${r+1} columna ${c+1}, ${p.grid[r][c]}">${p.grid[r][c]}</button>`;
  return `<div id="mini"><div class="cwwrap"><div class="sopa" id="mSopa" style="--cs:${cs};grid-template-columns:repeat(${p.n},var(--cs))">${g}</div></div>
    <p id="mMsg" class="hint" role="status" style="min-height:1.3em"></p><div id="mMarcas"></div>
    <ol class="hint" style="margin:6px 0 0 18px">${p.palabras.map(w=>`<li>${esc(w.pista)} <span class="resp">${w.largo} letras</span></li>`).join('')}</ol></div>`;
}
function miniCruciHTML(p){
  MINI={tipo:'cruci',letras:{},celdas:{},dir:'H',p};
  p.entradas.forEach(e=>{ for(let i=0;i<e.largo;i++){ const k=(e.r+(e.dir==='V'?i:0))+','+(e.c+(e.dir==='H'?i:0)); if(!MINI.celdas[k]) MINI.celdas[k]={claves:[]}; MINI.celdas[k].claves.push(e.clave); if(i===0) MINI.celdas[k].n=e.n; }});
  const cs=`min(34px, calc((100vw - 90px) / ${p.cols}))`;
  let g=''; for(let r=0;r<p.filas;r++) for(let c=0;c<p.cols;c++){ const k=r+','+c, cel=MINI.celdas[k];
    g+=cel?`<div class="cwc">${cel.n?`<span class="num">${cel.n}</span>`:''}<input maxlength="1" autocomplete="off" autocapitalize="characters" data-r="${r}" data-c="${c}" aria-label="Fila ${r+1}, columna ${c+1}"></div>`:`<div class="cwb"></div>`; }
  const lis=d=>p.entradas.filter(e=>e.dir===d).map(e=>`<li><button class="cl" type="button" data-clave="${e.clave}"><b>${e.n}.</b> ${esc(e.pista)} <span class="hint">(${e.largo})</span></button></li>`).join('');
  return `<div id="mini"><div class="cwwrap"><div class="cw" id="mCw" style="--cs:${cs};grid-template-columns:repeat(${p.cols},var(--cs))">${g}</div></div>
    <div class="clues"><div><h4>Horizontales</h4><ul>${lis('H')}</ul></div><div><h4>Verticales</h4><ul>${lis('V')}</ul></div></div></div>`;
}
function miniCruciResp(){ const o={}; MINI.p.entradas.forEach(e=>{ o[e.clave]=Array.from({length:e.largo},(_,i)=>MINI.letras[(e.r+(e.dir==='V'?i:0))+','+(e.c+(e.dir==='H'?i:0))]||'').join(''); }); return o; }
function enlazarMini(){
  if(!MINI||!$('#mini')) return;
  const p=MINI.p;
  if(MINI.tipo==='sopa'){
    const cel=[...document.querySelectorAll('#mSopa .sc')], sc=(r,c)=>cel[r*p.n+c];
    const linea=s=>{ const [r1,c1,r2,c2]=s, dr=Math.sign(r2-r1), dc=Math.sign(c2-c1), n=Math.max(Math.abs(r2-r1),Math.abs(c2-c1)); return Array.from({length:n+1},(_,i)=>[r1+dr*i,c1+dc*i]); };
    const pintar=()=>{ cel.forEach(b=>{b.style.background='';b.style.color='';b.classList.remove('ini');});
      MINI.sopa.forEach((s,i)=>linea(s).forEach(([r,c])=>{ const b=sc(r,c); b.style.background=`hsl(${(i*53+90)%360} 65% 34%)`; b.style.color='#fff'; }));
      if(MINI.ini) sc(MINI.ini[0],MINI.ini[1]).classList.add('ini');
      $('#mMarcas').innerHTML=MINI.sopa.length?`<div class="hint">Marcadas: <b>${MINI.sopa.length}</b> de ${p.palabras.length}. Toquen una marca para quitarla.</div>`+MINI.sopa.map((s,i)=>`<button class="marca2" type="button" data-i="${i}" style="border-color:hsl(${(i*53+90)%360} 65% 50%)">${linea(s).map(([r,c])=>p.grid[r][c]).join('')} ✕</button>`).join(''):'';
      document.querySelectorAll('#mMarcas .marca2').forEach(b=>b.onclick=()=>{ MINI.sopa.splice(+b.dataset.i,1); pintar(); }); };
    cel.forEach(b=>b.onclick=()=>{ const r=+b.dataset.r, c=+b.dataset.c, m=$('#mMsg'); m.textContent='';
      if(!MINI.ini){ MINI.ini=[r,c]; pintar(); return; } const [r1,c1]=MINI.ini; if(r1===r&&c1===c){ MINI.ini=null; pintar(); return; }
      const dr=r-r1, dc=c-c1; if(!(dr===0||dc===0||Math.abs(dr)===Math.abs(dc))){ m.textContent='Esa línea no es recta: horizontal, vertical o diagonal.'; MINI.ini=null; pintar(); return; }
      if(MINI.sopa.length>=p.palabras.length+3){ m.textContent='Demasiadas marcas: quiten alguna.'; MINI.ini=null; pintar(); return; }
      MINI.sopa.push([r1,c1,r,c]); MINI.ini=null; sonar('par'); pintar(); });
    pintar();
  } else {
    const inputs=[...document.querySelectorAll('#mCw input')], porK={}; inputs.forEach(i=>porK[i.dataset.r+','+i.dataset.c]=i);
    const entradaDe=k=>{ const c=MINI.celdas[k]; const cl=c.claves.find(x=>x.endsWith(MINI.dir))||c.claves[0]; MINI.dir=cl.slice(-1); return p.entradas.find(e=>e.clave===cl); };
    const celdasDe=e=>Array.from({length:e.largo},(_,i)=>(e.r+(e.dir==='V'?i:0))+','+(e.c+(e.dir==='H'?i:0)));
    const marcar=e=>{ inputs.forEach(i=>i.parentNode.classList.remove('act')); if(e) celdasDe(e).forEach(k=>porK[k].parentNode.classList.add('act')); };
    inputs.forEach(inp=>{ const k=inp.dataset.r+','+inp.dataset.c;
      inp.addEventListener('focus',()=>{ marcar(entradaDe(k)); inp.select(); });
      inp.addEventListener('click',()=>{ if(MINI.celdas[k].claves.length>1&&document.activeElement===inp) MINI.dir=MINI.dir==='H'?'V':'H'; marcar(entradaDe(k)); });
      inp.addEventListener('input',()=>{ const l=sinTildes(inp.value).slice(-1); inp.value=l; MINI.letras[k]=l;
        if(l){ const e=entradaDe(k), ks=celdasDe(e), i=ks.indexOf(k); if(i>=0&&i<ks.length-1) porK[ks[i+1]].focus(); } });
      inp.addEventListener('keydown',e=>{ const d={ArrowRight:[0,1],ArrowLeft:[0,-1],ArrowDown:[1,0],ArrowUp:[-1,0]}[e.key];
        if(d){ const n=porK[(+inp.dataset.r+d[0])+','+(+inp.dataset.c+d[1])]; if(n){ e.preventDefault(); n.focus(); } }
        else if(e.key==='Backspace'&&!inp.value){ const en=entradaDe(k), ks=celdasDe(en), i=ks.indexOf(k); if(i>0){ e.preventDefault(); porK[ks[i-1]].focus(); } } }); });
    document.querySelectorAll('#mini .cl').forEach(b=>b.onclick=()=>{ const e=p.entradas.find(x=>x.clave===b.dataset.clave); MINI.dir=e.dir; porK[e.r+','+e.c].focus(); });
  }
}

/* ---------- control de salidas ---------- */
let fuera=false;
function salio(){ if(E&&/^Revisi[oó]n /.test(E.grupo.nombre)) return; if(!token||fuera||!E||modo!=='juego'||!E.abierto||E.tiempo.agotado||E.reto.entregado) return; fuera=true;
  api('/api/salida','POST',{tipo:'salida'}).then(r=>{ if(r&&E){ E.salidas=r.salidas; E.penalizacion_actual=r.penalizacion; } }).catch(()=>{}); }
function volvio(){ if(!fuera) return; fuera=false;
  api('/api/salida','POST',{tipo:'regreso'}).then(r=>{ if(!r||!E) return; E.salidas=r.salidas; E.penalizacion_actual=r.penalizacion; pintarBarra();
    const n=r.salidas, g=E.salidas_gratis; $('#ovTitulo').textContent=`Salida n.º ${n} registrada`;
    $('#ovTexto').innerHTML = n<=g ? `Todavía no pierden puntos (van ${n} de ${g} salidas sin descuento). <b>Desde la ${g+1}.ª, cada salida resta ${f2(E.descuento)}</b>.` : `Ya superaron las ${g} salidas sin descuento. Esta salida <b>resta ${f2(E.descuento)}</b>. Descuento acumulado: <b>−${f2(r.penalizacion)}</b>.`;
    $('#ovSalida').classList.add('on'); $('#ovBtn').focus(); }).catch(()=>{}); }
document.addEventListener('visibilitychange',()=>{ document.hidden?salio():volvio(); });
window.addEventListener('blur',()=>{ setTimeout(()=>{ if(!document.hasFocus()&&!document.querySelector('select:focus,input:focus')) salio(); },200); });
window.addEventListener('focus',()=>volvio());
$('#ovBtn').onclick=()=>$('#ovSalida').classList.remove('on');
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ $('#ovSalida').classList.remove('on'); cerrarModal(); } });

/* ---------- arranque y sondeo ---------- */
function ocupado(){ // no repintar mientras escriben o hay una respuesta en pantalla
  return (vista==='exp'&&!E.expediente.entregado) || (vista==='reto'&&RT) || $('#btnSig') || (preguntaActual&&['sopa','cruci'].includes(preguntaActual.tipo)&&$('#mini')) || (preguntaActual&&(sel.length||tamborActivo!==null||bodegaSel.some(v=>v>=0)||(preguntaActual.tipo==='order'&&ordenActual.join()!==(preguntaActual.opciones||[]).map(o=>o.k).join()))) || $('#modal').classList.contains('on');
}
async function refrescar(forzar){
  try{ const nuevo=await api('/api/estado'); const antes=E; E=nuevo; fijarReloj();
    const cambioFase = !antes || antes.abierto!==E.abierto || antes.fase!==E.fase || antes.tiempo.agotado!==E.tiempo.agotado || antes.publicado!==E.publicado || antes.reto_abierto!==E.reto_abierto;
    if(forzar || cambioFase || !ocupado()) { if(!forzar && !cambioFase && modo==='juego' && vista.startsWith('z') && preguntaActual && E.preguntas[vista.slice(1)] && E.preguntas[vista.slice(1)].id===preguntaActual.id){ pintarBarra(); const a=document.querySelector('aside'); if(a){ a.innerHTML=lateral(); pintarPuzzle(fichasPrevias);} } else render(); }
    else { pintarBarra(); const a=document.querySelector('aside'); if(a){ a.innerHTML=lateral(); pintarPuzzle(fichasPrevias); } }
  }catch(e){}
}
async function iniciar(){
  try{ E=await api('/api/estado'); }catch(e){ return; }
  fijarReloj(); fichasPrevias=null;
  if(E.fase==='extras') vista='extras';
  render();
  clearInterval(window.__poll); window.__poll=setInterval(()=>{ if(token&&!fuera) refrescar(false); },6000);
}
